<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 580" font-family="'Inter','Segoe UI',system-ui,sans-serif" role="img" aria-label="Architecture du Vault Keeper : CloudShell appelle API Gateway puis Lambda, qui lit Secrets Manager, journalise dans CloudWatch Logs, et appelle Nova Lite au travers d'un Bedrock Guardrail, le tout régi par un rôle IAM de moindre privilège">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#8795ab"/>
    </marker>
    <marker id="ao" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ff9900"/>
    </marker>
    <filter id="soft" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#1f2937" flood-opacity="0.12"/>
    </filter>
    <style>
      .name{font-weight:700;font-size:14.5px;fill:#232f3e}
      .sub{font-size:11px;fill:#5A6B87}
      .edge{font-size:11px;fill:#5A6B87;font-weight:600}
      .glyph{fill:none;stroke:#ffffff;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
    </style>
  </defs>

  <rect x="0" y="0" width="1120" height="580" fill="#f6f8fc"/>

  <!-- header -->
  <rect x="0" y="0" width="1120" height="60" fill="#232f3e"/>
  <rect x="0" y="57" width="1120" height="3" fill="#ff9900"/>
  <text x="36" y="31" font-size="18" font-weight="700" fill="#ffffff">Vault Keeper — architecture</text>
  <text x="36" y="48" font-size="12" fill="#ffb347">Amazon Bedrock Guardrails · AWS SAM · région eu-west-1</text>

  <!-- ============ EDGES (drawn first, behind cards) ============ -->
  <!-- spine -->
  <line x1="216" y1="280" x2="252" y2="280" stroke="#8795ab" stroke-width="2.5" marker-end="url(#a)"/>
  <line x1="432" y1="280" x2="468" y2="280" stroke="#8795ab" stroke-width="2.5" marker-end="url(#a)"/>
  <!-- lambda -> secrets (up) -->
  <line x1="560" y1="234" x2="560" y2="190" stroke="#8795ab" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="570" y="216" class="edge">GetSecretValue</text>
  <!-- lambda -> logs (down) -->
  <line x1="560" y1="326" x2="560" y2="370" stroke="#8795ab" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="570" y="354" class="edge">logs</text>
  <!-- lambda -> guardrail -> nova (orange, the protected model call) -->
  <line x1="648" y1="280" x2="708" y2="280" stroke="#ff9900" stroke-width="2.5" marker-end="url(#ao)"/>
  <line x1="880" y1="280" x2="908" y2="280" stroke="#ff9900" stroke-width="2.5" marker-end="url(#ao)"/>
  <text x="764" y="214" text-anchor="middle" class="edge" fill="#b26a00">Converse + guardrailConfig</text>
  <!-- iam -> lambda (governs, dashed) -->
  <path d="M360 372 L 486 330" fill="none" stroke="#8795ab" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#a)"/>

  <!-- ============ CARD A : CloudShell ============ -->
  <g filter="url(#soft)">
    <rect x="40" y="234" width="176" height="92" rx="14" fill="#ffffff" stroke="#d8dfeb" stroke-width="2"/>
  </g>
  <rect x="111" y="244" width="34" height="34" rx="9" fill="#232f3e"/>
  <polyline class="glyph" points="122,255 129,261 122,267"/>
  <line class="glyph" x1="130" y1="267" x2="137" y2="267"/>
  <text x="128" y="298" text-anchor="middle" class="name">AWS CloudShell</text>
  <text x="128" y="315" text-anchor="middle" class="sub">ask.sh · score.py</text>

  <!-- ============ CARD B : API Gateway ============ -->
  <g filter="url(#soft)">
    <rect x="256" y="234" width="176" height="92" rx="14" fill="#ffffff" stroke="#d8dfeb" stroke-width="2"/>
  </g>
  <rect x="327" y="244" width="34" height="34" rx="9" fill="#232f3e"/>
  <path class="glyph" d="M344 253 L352 261 L344 269 L336 261 Z"/>
  <circle cx="344" cy="261" r="1.6" fill="#ffffff"/>
  <text x="344" y="298" text-anchor="middle" class="name">API Gateway</text>
  <text x="344" y="315" text-anchor="middle" class="sub">HTTP API · POST /chat</text>

  <!-- ============ CARD C : Lambda ============ -->
  <g filter="url(#soft)">
    <rect x="472" y="234" width="176" height="92" rx="14" fill="#ffffff" stroke="#d8dfeb" stroke-width="2"/>
  </g>
  <rect x="543" y="244" width="34" height="34" rx="9" fill="#232f3e"/>
  <text x="560" y="269" text-anchor="middle" font-size="20" font-weight="700" fill="#ffffff" font-family="'Space Grotesk',sans-serif">&#955;</text>
  <text x="560" y="298" text-anchor="middle" class="name">AWS Lambda</text>
  <text x="560" y="315" text-anchor="middle" class="sub">Vault Keeper · Python 3.13</text>

  <!-- ============ CARD D : Bedrock Guardrail (built) ============ -->
  <g filter="url(#soft)">
    <rect x="712" y="234" width="168" height="92" rx="14" fill="#fffaf2" stroke="#ff9900" stroke-width="2.5" stroke-dasharray="7 5"/>
  </g>
  <rect x="779" y="244" width="34" height="34" rx="9" fill="#232f3e"/>
  <path class="glyph" d="M796 253 L803 256 L803 262 Q803 268 796 270 Q789 268 789 262 L789 256 Z"/>
  <polyline class="glyph" points="793,261 795,263 799,258"/>
  <text x="796" y="298" text-anchor="middle" class="name">Bedrock Guardrail</text>
  <text x="796" y="315" text-anchor="middle" class="sub">filtre · topic · anonymise</text>

  <!-- ============ CARD E : Nova Lite ============ -->
  <g filter="url(#soft)">
    <rect x="912" y="234" width="176" height="92" rx="14" fill="#ffffff" stroke="#d8dfeb" stroke-width="2"/>
  </g>
  <rect x="983" y="244" width="34" height="34" rx="9" fill="#232f3e"/>
  <path d="M1000 253 Q1001.5 259.5 1008 261 Q1001.5 262.5 1000 269 Q998.5 262.5 992 261 Q998.5 259.5 1000 253 Z" fill="#ffffff"/>
  <text x="1000" y="298" text-anchor="middle" class="name">Amazon Nova Lite</text>
  <text x="1000" y="315" text-anchor="middle" class="sub">profil d'inférence EU</text>

  <!-- ============ CARD F : Secrets Manager ============ -->
  <g filter="url(#soft)">
    <rect x="472" y="94" width="176" height="92" rx="14" fill="#ffffff" stroke="#d8dfeb" stroke-width="2"/>
  </g>
  <rect x="543" y="104" width="34" height="34" rx="9" fill="#232f3e"/>
  <rect class="glyph" x="554" y="121" width="12" height="9" rx="1.6"/>
  <path class="glyph" d="M557 121 L557 117 Q557 114 560 114 Q563 114 563 117 L563 121"/>
  <circle cx="560" cy="125.5" r="1.3" fill="#ffffff" stroke="none"/>
  <text x="560" y="158" text-anchor="middle" class="name">Secrets Manager</text>
  <text x="560" y="175" text-anchor="middle" class="sub">VAULT-xxxxxxxx</text>

  <!-- ============ CARD G : CloudWatch Logs (built) ============ -->
  <g filter="url(#soft)">
    <rect x="472" y="374" width="176" height="92" rx="14" fill="#fffaf2" stroke="#ff9900" stroke-width="2.5" stroke-dasharray="7 5"/>
  </g>
  <rect x="543" y="384" width="34" height="34" rx="9" fill="#232f3e"/>
  <rect class="glyph" x="553" y="393" width="14" height="16" rx="2"/>
  <line class="glyph" x1="556" y1="398" x2="564" y2="398"/>
  <line class="glyph" x1="556" y1="401" x2="564" y2="401"/>
  <line class="glyph" x1="556" y1="404" x2="561" y2="404"/>
  <text x="560" y="438" text-anchor="middle" class="name">CloudWatch Logs</text>
  <text x="560" y="455" text-anchor="middle" class="sub">data protection policy</text>

  <!-- ============ CARD H : IAM role (built) ============ -->
  <g filter="url(#soft)">
    <rect x="256" y="374" width="176" height="92" rx="14" fill="#fffaf2" stroke="#ff9900" stroke-width="2.5" stroke-dasharray="7 5"/>
  </g>
  <rect x="327" y="384" width="34" height="34" rx="9" fill="#232f3e"/>
  <circle class="glyph" cx="340" cy="398" r="4"/>
  <line class="glyph" x1="343" y1="401" x2="350" y2="408"/>
  <line class="glyph" x1="347" y1="407" x2="350" y2="404"/>
  <text x="344" y="438" text-anchor="middle" class="name">Rôle IAM</text>
  <text x="344" y="455" text-anchor="middle" class="sub">moindre privilège</text>

  <!-- ============ LEGEND ============ -->
  <rect x="300" y="502" width="520" height="52" rx="12" fill="#ffffff" stroke="#e4e9f1" stroke-width="1.5"/>
  <rect x="320" y="520" width="22" height="15" rx="4" fill="#ffffff" stroke="#d8dfeb" stroke-width="2"/>
  <text x="350" y="532" class="sub">Composant fourni</text>
  <rect x="470" y="520" width="22" height="15" rx="4" fill="#fffaf2" stroke="#ff9900" stroke-width="2.5" stroke-dasharray="5 3"/>
  <text x="500" y="532" class="sub">Construit par vous</text>
  <line x1="640" y1="528" x2="668" y2="528" stroke="#ff9900" stroke-width="2.5" marker-end="url(#ao)"/>
  <text x="676" y="532" class="sub">Appel protégé par le Guardrail</text>
</svg>
