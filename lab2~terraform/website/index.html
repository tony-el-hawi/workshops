<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Text-to-Speech — Lab Terraform</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>🔊 Text-to-Speech</h1>
    <p>Application serverless déployée via Terraform</p>
  </header>

  <main>
    <section class="convert-section">
      <h2>Convertir du texte en audio</h2>
      <form id="convert-form">
        <div class="form-group">
          <label for="voice">Voix :</label>
          <select id="voice">
            <option value="Mathieu">Mathieu (FR)</option>
            <option value="Celine">Céline (FR)</option>
            <option value="Lea">Léa (FR)</option>
            <option value="Joanna">Joanna (EN)</option>
            <option value="Matthew">Matthew (EN)</option>
            <option value="Lucia">Lucia (ES)</option>
          </select>
        </div>
        <div class="form-group">
          <label for="text-input">Texte à convertir :</label>
          <textarea id="text-input" rows="5" placeholder="Saisissez le texte à convertir en audio..." required></textarea>
        </div>
        <button type="submit" id="btn-convert">Convertir</button>
        <p id="status-msg" class="status" hidden></p>
      </form>
    </section>

    <section class="posts-section">
      <h2>Mes conversions</h2>
      <button id="btn-refresh" type="button">Rafraîchir</button>
      <div id="posts-list">
        <p class="empty">Aucune conversion pour le moment.</p>
      </div>
    </section>
  </main>

  <script src="scripts.js"></script>
</body>
</html>
